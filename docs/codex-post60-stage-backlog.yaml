program: post-60-productization
mission: >
  Make Open Transit RT the easiest, cheapest, safest open-source self-hosted
  backend for small agencies and civic technologists to publish GTFS and GTFS
  Realtime, connect external systems through adapter/sidecar plugins, and
  evaluate CAL-ITP/Caltrans-style readiness without unsupported claims.

global_boundaries:
  no_phase_61_without_approval: true
  no_docs_evidence_writes_without_evidence_track_approval: true
  consumer_statuses_stay_prepared_without_target_originated_evidence: true
  forbidden_claims:
    - CAL-ITP/Caltrans compliance
    - consumer acceptance or ingestion
    - agency adoption or approval
    - agency-owned final root
    - hosted SaaS
    - paid support or SLA
    - production readiness
    - production multi-tenant hosting
    - vendor compatibility
    - certified hardware support
    - production-grade ETA quality
    - public launch completion

baseline_checks:
  - make audit-final-claim-review
  - make validate
  - make test
  - make smoke
  - git diff --check
  - python3 -m json.tool docs/evidence/consumer-submissions/status.json >/dev/null
  - exact seven-target prepared-only consumer tracker check
  - git diff --exit-code -- docs/evidence/consumer-submissions/status.json
  - docker compose -f deploy/docker-compose.yml config

stages:
  - id: stage-0
    name: Repo truth and validation baseline
    commit: null
    deliverables: []
    exit_gate: Patch only stale truth-state or validation issues before product work.

  - id: stage-1
    name: Post-60 product direction realignment
    commit: "Post-60 -- Checkpoint 000001: realign default roadmap to external connection quality"
    deliverables:
      - docs/post-60-product-roadmap.md
      - updates to docs/handoffs/latest.md
      - updates to docs/current-status.md
      - updates to docs/roadmap-to-calitp-compliance-and-gap-closure.md
      - updates to docs/integration-adapter-kit.md
    exit_gate: Default next work is product quality/external connection maturity, not real agency/public pilot.

  - id: stage-2
    name: Release-candidate readiness and stabilization
    commit: "Post-60 -- Checkpoint 000002: add release-candidate readiness check"
    deliverables:
      - docs/release-candidate-readiness.md
      - scripts/release-candidate-check.sh
      - make release-candidate-check
    exit_gate: Full RC check exists; no tag or publish without explicit approval.

  - id: stage-3
    name: External connector plugin contract
    commit: "Post-60 -- Checkpoint 000003: add connector plugin contract"
    deliverables:
      - docs/connectors/plugin-contract.md
      - docs/external-connection-readiness.md
      - internal/connectors/manifest.go
      - internal/connectors/manifest_test.go
      - testdata/connectors/valid
      - testdata/connectors/invalid
      - scripts/external-connection-check.sh
      - make external-connection-check
    exit_gate: Sidecar/manifest/conformance model exists; no arbitrary dynamic plugin loading.

  - id: stage-4
    name: Adapter conformance suite
    commit: "Post-60 -- Checkpoint 000004: add adapter conformance suite"
    deliverables:
      - cmd/adapter-conformance
      - docs/tutorials/external-adapter-conformance.md
      - testdata/adapter-conformance
    exit_gate: Telemetry, prediction, validator, and monitoring failure modes are testable with synthetic data.

  - id: stage-5
    name: Generic connector examples
    commit: "Post-60 -- Checkpoint 000005: add generic connector examples"
    deliverables:
      - examples/connectors/telemetry-http-poller
      - examples/connectors/telemetry-csv-replay
      - examples/connectors/predictor-sidecar-stub
      - examples/connectors/monitoring-export
    exit_gate: Examples are synthetic-only and carry no vendor compatibility claim.

  - id: stage-6
    name: Agency launchpad UX hardening
    commit: "Post-60 -- Checkpoint 000006: add agency launchpad workflow"
    deliverables:
      - docs/tutorials/agency-launchpad.md
      - optional private /admin/operations/launchpad
      - optional private /admin/operations/launchpad.json
    exit_gate: Operators have a clear setup-to-readiness workflow with no approval/compliance flags.

  - id: stage-7
    name: CAL-ITP/Caltrans readiness hardening
    commit: "Post-60 -- Checkpoint 000007: add Caltrans readiness gap check"
    deliverables:
      - docs/caltrans-readiness-gap-report.md
      - scripts/caltrans-readiness-check.sh
      - make caltrans-readiness-check
    exit_gate: Readiness gaps are reported to .cache only and remain claim-bounded.

  - id: stage-8
    name: Optional evidence-track router
    commit: "Post-60 -- Checkpoint 000008: add evidence-track router"
    deliverables:
      - docs/evidence/evidence-track-router.md
    exit_gate: Real-world opportunities route through intake-first evidence gates.
