name: Local checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Go and connector checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Check external connector manifests
        run: make external-connection-check

      - name: Run adapter conformance
        run: make adapter-conformance

      - name: Test connector examples
        run: make test-connector-examples

      - name: Validate consumer tracker JSON
        run: python3 -m json.tool docs/evidence/consumer-submissions/status.json >/dev/null

      - name: Verify prepared-only consumer tracker
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = [
              "Google Maps",
              "Apple Maps",
              "Transit App",
              "Bing Maps",
              "Moovit",
              "Mobility Database",
              "transit.land",
          ]

          data = json.loads(Path("docs/evidence/consumer-submissions/status.json").read_text())
          records = data.get("targets", [])
          seen = {row["target"]: row.get("status") for row in records}
          assert list(seen) == expected, seen
          assert all(seen[name] == "prepared" for name in expected), seen
          PY
