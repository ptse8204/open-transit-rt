name: Fast CI

on:
  pull_request:
  push:
    branches:
      - main
      - stable

permissions:
  contents: read

jobs:
  fast-checks:
    name: Go tests and repo guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Run lightweight repo check
        run: make check

      - name: Verify prepared-only consumer tracker
        run: scripts/check-consumer-tracker.sh

      - name: Run final claim audit
        run: make audit-final-claim-review
